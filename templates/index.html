<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASX Portfolio Tracker</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --border: #e2e4e9;
    --text: #16181d;
    --muted: #6b7280;
    --accent: #2563eb;
    --fast: #16a34a;
    --mid: #d97706;
    --slow: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #181b21;
      --border: #2a2e37;
      --text: #e7e9ee;
      --muted: #9aa0ab;
      --accent: #5b8def;
      --fast: #34d399;
      --mid: #fbbf24;
      --slow: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px 24px 64px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; }
  .subtitle { color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .stat-value.fast { color: var(--fast); }
  .stat-value.mid { color: var(--mid); }
  .stat-value.slow { color: var(--slow); }
  .latency-card { grid-column: span 1; }
  #latency-bars {
    display: flex; align-items: flex-end; gap: 3px; height: 40px; margin-top: 10px;
  }
  #latency-bars .bar { flex: 1; border-radius: 2px 2px 0 0; min-height: 4px; }
  .bar.fast { background: var(--fast); }
  .bar.mid { background: var(--mid); }
  .bar.slow { background: var(--slow); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  td:last-child, th:last-child { text-align: right; }
  .movers { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .movers h2 { margin-bottom: 8px; }
  ul.mover-list { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; font-size: 14px; }
  ul.mover-list li { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  li.gain { color: var(--fast); }
  li.loss { color: var(--slow); }
  .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  button {
    background: var(--accent); color: white; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #last-updated { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ASX Portfolio Tracker</h1>
      <div class="subtitle">Live via yfinance &middot; delayed ~15&ndash;20 min</div>
    </div>
  </header>

  <div class="controls">
    <button id="refresh-btn">Refresh now</button>
    <span id="last-updated">&mdash;</span>
  </div>

  <div class="stats">
    <div class="card latency-card">
      <div class="stat-label">Response time</div>
      <div class="stat-value" id="latency-value">&mdash;</div>
      <div id="latency-bars"></div>
    </div>
    <div class="card">
      <div class="stat-label">Portfolio value</div>
      <div class="stat-value" id="total-value">&mdash;</div>
    </div>
    <div class="card">
      <div class="stat-label">Average price</div>
      <div class="stat-value" id="average-value">&mdash;</div>
    </div>
  </div>

  <div class="panel">
    <h2>Holdings</h2>
    <table>
      <thead><tr><th>Ticker</th><th>Company</th><th>Price</th></tr></thead>
      <tbody id="holdings-body"></tbody>
    </table>
  </div>

  <div class="panel movers">
    <div>
      <h2>Gainers</h2>
      <ul class="mover-list" id="gainers-list"></ul>
    </div>
    <div>
      <h2>Losers</h2>
      <ul class="mover-list" id="losers-list"></ul>
    </div>
  </div>
</div>

<script>
  const REFRESH_MS = {{ refresh_seconds }} * 1000;
  let latencyHistory = [];

  function fmt(v) {
    return '$' + v.toLocaleString('en-AU', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function renderMovers(elementId, movers, isGainers) {
    const el = document.getElementById(elementId);
    el.innerHTML = '';
    for (const m of movers) {
      const li = document.createElement('li');
      li.className = isGainers ? 'gain' : 'loss';
      const sign = m.change_pct >= 0 ? '+' : '';
      const left = document.createElement('span');
      left.textContent = `${m.ticker}  ${fmt(m.price)}`;
      const right = document.createElement('span');
      right.textContent = `${sign}${m.change_pct.toFixed(2)}%`;
      li.appendChild(left);
      li.appendChild(right);
      el.appendChild(li);
    }
  }

  function latencyClass(ms) {
    return ms < 500 ? 'fast' : ms < 1500 ? 'mid' : 'slow';
  }

  function renderLatencyBars() {
    const el = document.getElementById('latency-bars');
    el.innerHTML = '';
    const max = Math.max(...latencyHistory, 100);
    for (const ms of latencyHistory) {
      const bar = document.createElement('div');
      bar.className = 'bar ' + latencyClass(ms);
      bar.style.height = Math.max(4, (ms / max) * 100) + '%';
      bar.title = ms.toFixed(0) + ' ms';
      el.appendChild(bar);
    }
  }

  function render(data) {
    const latencyEl = document.getElementById('latency-value');
    latencyEl.textContent = data.elapsed_ms.toFixed(0) + ' ms';
    latencyEl.className = 'stat-value ' + latencyClass(data.elapsed_ms);

    document.getElementById('total-value').textContent = fmt(data.total);
    document.getElementById('average-value').textContent = fmt(data.average);

    const tbody = document.getElementById('holdings-body');
    tbody.innerHTML = '';
    for (const row of data.rows) {
      const tr = document.createElement('tr');
      const tdTicker = document.createElement('td');
      tdTicker.textContent = row.ticker;
      const tdName = document.createElement('td');
      tdName.textContent = row.name;
      const tdPrice = document.createElement('td');
      tdPrice.textContent = fmt(row.price);
      tr.append(tdTicker, tdName, tdPrice);
      tbody.appendChild(tr);
    }

    renderMovers('gainers-list', data.gainers, true);
    renderMovers('losers-list', data.losers, false);

    latencyHistory.push(data.elapsed_ms);
    if (latencyHistory.length > 20) latencyHistory.shift();
    renderLatencyBars();

    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  }

  async function loadPortfolio() {
    const btn = document.getElementById('refresh-btn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/portfolio');
      const data = await res.json();
      render(data);
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', loadPortfolio);
  loadPortfolio();
  setInterval(loadPortfolio, REFRESH_MS);
</script>
</body>
</html>
